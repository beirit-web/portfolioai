name: Beirit Digital CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "server/**"
      - "sprachdienstleistungen/**"
      - "apps/deutsch-live/frontend/**"
      - "scripts/check_portfolio_data.py"
      - "scripts/test_portfolio_data.py"
      - ".gitignore"
      - ".github/workflows/beirit-ci.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "frontend/**"
      - "server/**"
      - "sprachdienstleistungen/**"
      - "apps/deutsch-live/frontend/**"
      - "scripts/check_portfolio_data.py"
      - "scripts/test_portfolio_data.py"
      - ".gitignore"
      - ".github/workflows/beirit-ci.yml"
  workflow_dispatch:

jobs:
  beirit:
    name: Frontend build and backend checks
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: local
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-check-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver,portfolio.example.invalid
      CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,https://portfolio.example.invalid
      SECURE_SSL_REDIRECT: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Run frontend regression tests
        working-directory: frontend
        run: npm test

      - name: Install DeutschLive frontend dependencies
        working-directory: apps/deutsch-live/frontend
        run: npm ci

      - name: Build DeutschLive for the platform and local recording archive
        working-directory: apps/deutsch-live/frontend
        run: |
          npm run build:platform
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Check portfolio source data
        run: |
          python3 scripts/test_portfolio_data.py
          python3 scripts/check_portfolio_data.py

      - name: Install backend dependencies
        working-directory: server
        run: python -m pip install -r requirements.txt

      - name: Check deploy isolation
        working-directory: server
        run: python3 bin/check_deploy_isolation.py

      - name: Run Django system check
        working-directory: server
        run: python manage.py check

      - name: Check for missing migrations
        working-directory: server
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        working-directory: server
        run: python manage.py test

      - name: Install browser for UI checks
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Check functional and responsive UI
        working-directory: frontend
        run: npm run test:browser

      - name: Check integrated language-platform backend
        working-directory: sprachdienstleistungen
        run: python manage.py test lessons.tests pages.tests_domain_isolation pages.tests_vokabelbox

      - name: Check integrated language-platform UI
        working-directory: frontend
        run: npm run test:vokabelbox

      - name: Save browser report and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beirit-browser-checks
          path: |
            runtime/browser-checks/
            runtime/vokabelbox-checks/
          if-no-files-found: ignore
