name: DeutschLive CI

on:
  pull_request:
    paths:
      - "apps/deutsch-live/**"
      - "server/assets/deutschlive-dist/**"
      - ".github/workflows/deutschlive-ci.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "apps/deutsch-live/**"
      - "server/assets/deutschlive-dist/**"
      - ".github/workflows/deutschlive-ci.yml"
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests and demo check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/deutsch-live/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: apps/deutsch-live/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python manage.py test lessons.tests

      - name: Prepare frontend_dist smoke artifact
        run: mkdir -p frontend_dist && printf '<div id="root"></div>' > frontend_dist/index.html

      - name: Run portfolio demo system check
        env:
          DJANGO_ENV: local
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ci-only-demo-check-secret
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          DJANGO_SECURE_SSL_REDIRECT: "false"
        run: python manage.py check

  frontend:
    name: Frontend builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/deutsch-live/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/deutsch-live/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build embedded assets
        run: npm run build

      - name: Build standalone assets
        run: VITE_OUT_DIR=dist VITE_STATIC_BASE=/ VITE_APP_BASE= npm run build
