{% extends "housing_search/base.html" %}

{% block title %}Suchprofil{% endblock %}

{% block content %}
  <div class="page-header">
    <div>
      <h1>Suchprofil</h1>
      <p>Filter und Prioritaeten fuer passende Wohnungstreffer.</p>
    </div>
    <a class="button" href="{% url 'housing_search:search_profile_list' %}">Zurueck</a>
  </div>

  <form method="post" class="form-grid">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="primary" type="submit">Speichern</button>
  </form>
{% endblock %}
