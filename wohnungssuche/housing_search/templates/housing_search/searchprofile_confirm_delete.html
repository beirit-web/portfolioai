{% extends "housing_search/base.html" %}

{% block title %}Suchprofil loeschen{% endblock %}

{% block content %}
  <section class="auth-panel">
    <h1>Suchprofil loeschen</h1>
    <p>{{ object.name }} wirklich loeschen?</p>
    <form method="post" class="actions">
      {% csrf_token %}
      <button class="danger" type="submit">Loeschen</button>
      <a class="button" href="{% url 'housing_search:search_profile_list' %}">Abbrechen</a>
    </form>
  </section>
{% endblock %}
