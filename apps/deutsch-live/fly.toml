# PORTFOLIO SAMPLE ONLY. No hosting account or active deployment target.
app = "deutschlive-demo-example"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORTFOLIO_DEMO_MODE = "true"
  EMAIL_BACKEND = "django.core.mail.backends.console.EmailBackend"
  DJANGO_ENV = "production"
  DJANGO_DEBUG = "false"
  DJANGO_ALLOWED_HOSTS = "deutschlive-host.example.invalid,deutschlive.example.invalid"
  DJANGO_CORS_ALLOWED_ORIGINS = "https://deutschlive-host.example.invalid,https://deutschlive.example.invalid"
  DJANGO_CSRF_TRUSTED_ORIGINS = "https://deutschlive-host.example.invalid,https://deutschlive.example.invalid"
  DJANGO_USE_X_FORWARDED_PROTO = "true"
  DJANGO_SECURE_SSL_REDIRECT = "true"
  USE_REDIS_CHANNEL_LAYER = "false"
  REALTIME_NOTIFICATIONS_ENABLED = "true"
  AI_FEATURES_ENABLED = "false"
  BILLING_SUCCESS_URL = "https://deutschlive.example.invalid/dashboard"
  BILLING_CANCEL_URL = "https://deutschlive.example.invalid/dashboard"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
