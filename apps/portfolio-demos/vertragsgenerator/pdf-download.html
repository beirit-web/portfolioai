<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PDF-Angebot-Demo von Beirit Digital zur browserseitigen PDF-Erzeugung mit JavaScript."
    />
    <meta
      name="keywords"
      content="Beirit Digital, PDF Generator, Angebot erstellen, JavaScript PDF, jsPDF, Webapp Demo"
    />
    <meta property="og:title" content="PDF-Angebot erzeugen | Beirit Digital" />
    <meta property="og:description" content="Browser-Demo zur PDF-Erstellung mit JavaScript und jsPDF." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <title>PDF-Angebot erzeugen | Beirit Digital</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body>
    <h1>PDF-Angebot erzeugen</h1>
    <button id="generatePdfBtn">Angebot als PDF speichern</button>

    <script>
      const { jsPDF } = window.jspdf;

      document
        .getElementById('generatePdfBtn')
        .addEventListener('click', () => {
          const doc = new jsPDF();

          doc.setFontSize(18);
          doc.text('Mini-Familienplaner - Angebot', 20, 20);

          doc.setFontSize(12);
          const textLines = [
            'Organisiere deine Familienaufgaben einfach und stressfrei!',
            '',
            'Features:',
            '- Aufgaben eingeben und abhaken',
            '- Belohnungssystem mit Sternen',
            '- Übersichtlich und kinderfreundlich',
            '- Web-App – keine Installation nötig',
            '',
            'Preis: 9,99 € einmalig',
            '',
            'Kontakt:',
            'E-Mail: deinname@example.com',
            'Web: deine-website.de',
            '',
            'Sie erhalten nach dem Kauf eine Zugangs-URL mit individuellem Login.',
            '',
            'Vielen Dank für Ihr Interesse!',
          ];

          doc.text(textLines, 20, 30);

          doc.save('angebot-mini-familienplaner.pdf');
        });
    </script>
  </body>
</html>
