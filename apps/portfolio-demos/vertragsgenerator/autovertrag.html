<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kaufvertrag-Generator für Auto, Motorrad und Quad als Beirit-Digital-Demo mit Formularlogik und PDF-Ausgabe."
    />
    <meta
      name="keywords"
      content="Beirit Digital, Kaufvertrag Generator, Autovertrag, Motorrad Kaufvertrag, PDF Generator, Formular Webapp"
    />
    <meta property="og:title" content="Kaufvertrag Generator | Beirit Digital" />
    <meta property="og:description" content="Browser-Demo für Kaufverträge mit Formular, Validierung und PDF-Erstellung." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <title>Kaufvertrag Generator | Beirit Digital</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 30px auto;
        padding: 30px;
        background-color: #f4f4f4;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
      }

      h1 {
        text-align: center;
        color: #2c3e50;
      }

      label {
        font-weight: bold;
        margin-top: 10px;
        display: block;
        color: #333;
      }

      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
        transition: border-color 0.3s ease;
      }

      input:focus,
      textarea:focus {
        border-color: #3498db;
        outline: none;
      }

      button {
        padding: 12px 24px;
        background-color: #27ae60;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s ease;
      }

      button:hover {
        background-color: #219150;
      }
    </style>
  </head>

  <body>
    <h1>Kaufvertrag Generator – Auto / Motorrad / Quad</h1>

    <label for="verkaeufer">Name Verkäufer:</label>
    <input
      type="text"
      id="verkaeufer"
    />

    <label for="adresseVerkaeufer">Adresse Verkäufer:</label>
    <input
      type="text"
      id="adresseVerkaeufer"
    />

    <label for="kaeufer">Name Käufer:</label>
    <input
      type="text"
      id="kaeufer"
    />

    <label for="adresseKaeufer">Adresse Käufer:</label>
    <input
      type="text"
      id="adresseKaeufer"
    />

    <label for="fahrzeug">Fahrzeugtyp (z. B. Auto, Motorrad, Quad):</label>
    <input
      type="text"
      id="fahrzeug"
    />

    <label for="marke">Marke & Modell:</label>
    <input
      type="text"
      id="marke"
    />

    <label for="baujahr">Baujahr:</label>
    <input
      type="text"
      id="baujahr"
    />

    <label for="farbe">Farbe:</label>
    <input
      type="text"
      id="farbe"
    />

    <label for="kilometer">Kilometerstand:</label>
    <input
      type="text"
      id="kilometer"
    />

    <label for="kennzeichen">Kennzeichen (optional):</label>
    <input
      type="text"
      id="kennzeichen"
    />

    <label for="fahrgestell">Fahrgestellnummer (FIN):</label>
    <input
      type="text"
      id="fahrgestell"
    />

    <label for="preis">Kaufpreis (EUR):</label>
    <input
      type="text"
      id="preis"
    />

    <label for="datum">Verkaufsdatum:</label>
    <input
      type="text"
      id="datum"
    />

    <label for="zusatz"
      >Zusätzliche Vereinbarungen (z. B. ohne Gewährleistung):</label
    >
    <textarea
      id="zusatz"
      rows="4"
    ></textarea>

    <button id="generateBtn">PDF-Kaufvertrag erzeugen</button>

    <script>
      const { jsPDF } = window.jspdf;

      document.getElementById('generateBtn').addEventListener('click', () => {
        const verkaeufer = document.getElementById('verkaeufer').value.trim();
        const kaeufer = document.getElementById('kaeufer').value.trim();
        const fahrzeug = document.getElementById('fahrzeug').value.trim();
        const marke = document.getElementById('marke').value.trim();
        const kennzeichen = document.getElementById('kennzeichen').value.trim();
        const fahrgestell = document.getElementById('fahrgestell').value.trim();
        const preis = document.getElementById('preis').value.trim();
        const datum = document.getElementById('datum').value.trim();
        const zusatz = document.getElementById('zusatz').value.trim();

        // Du kannst bei Bedarf weitere Felder hinzufügen:
        const baujahr = '2020'; // Optional: später als Eingabefeld ergänzen
        const farbe = 'Schwarz'; // Optional
        const kilometer = '25.000 km'; // Optional
        const adresseVerkaeufer = 'Adresse Verkäufer'; // Optional
        const adresseKaeufer = 'Adresse Käufer'; // Optional

        const doc = new jsPDF();
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(18);
        doc.text('Kaufvertrag Fahrzeug', 20, 20);

        doc.setLineWidth(0.5);
        doc.line(20, 22, 190, 22); // Trennlinie

        doc.setFontSize(12);
        doc.setFont('helvetica', 'normal');

        let y = 30;

        const addSection = (title, content) => {
          doc.setFont('helvetica', 'bold');
          doc.text(title, 20, y);
          y += 7;
          doc.setFont('helvetica', 'normal');
          content.split('\n').forEach((line) => {
            doc.text(line, 25, y);
            y += 6;
          });
          y += 4;
        };

        addSection('Verkäufer', `${verkaeufer}\n${adresseVerkaeufer}`);
        addSection('Käufer', `${kaeufer}\n${adresseKaeufer}`);
        addSection(
          'Fahrzeugdaten',
          `
Fahrzeugtyp: ${fahrzeug}
Marke & Modell: ${marke}
Baujahr: ${baujahr}
Farbe: ${farbe}
Kilometerstand: ${kilometer}
Kennzeichen: ${kennzeichen}
FIN: ${fahrgestell}`
        );
        addSection(
          'Kaufpreis & Datum',
          `Kaufpreis: ${preis} EUR\nVerkaufsdatum: ${datum}`
        );
        addSection('Zusätzliche Vereinbarungen', zusatz || 'Keine.');

        // Unterschriften
        y += 10;
        doc.line(20, y, 90, y);
        doc.text('Verkäufer', 35, y + 5);
        doc.line(120, y, 190, y);
        doc.text('Käufer', 145, y + 5);

        doc.save('kaufvertrag_fahrzeug.pdf');
      });
    </script>
  </body>
</html>
