# PORTFOLIO SAMPLE ONLY. No hosting account or active deployment target.
# fly.toml sample configuration file for a language-platform staging demo.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'language-demo-example'
primary_region = 'fra'
console_command = '/code/manage.py shell'

[build]

[env]
  PORTFOLIO_DEMO_MODE = 'True'
  EMAIL_BACKEND = 'django.core.mail.backends.console.EmailBackend'
  CSRF_COOKIE_SECURE = 'True'
  CSRF_TRUSTED_ORIGINS = 'https://languages-staging.example.invalid,https://www.languages-staging.example.invalid,https://languages-host.example.invalid'
  DJANGO_ALLOWED_HOSTS = 'languages-staging.example.invalid,www.languages-staging.example.invalid,languages-host.example.invalid'
  DB_BACKUP_PATH = '/data/db_backups'
  DB_PATH = '/data/db.sqlite3'
  MEDIA_ROOT = '/data/media'
  PORT = '8000'
  REDIRECT_OLD_HOSTS = 'www.languages-staging.example.invalid'
  RUN_MIGRATIONS = '1'
  SECURE_HSTS_INCLUDE_SUBDOMAINS = 'True'
  SECURE_HSTS_PRELOAD = 'True'
  SECURE_HSTS_SECONDS = '31536000'
  SECURE_SSL_REDIRECT = 'True'
  SESSION_COOKIE_SECURE = 'True'
  SITE_URL = 'https://languages-staging.example.invalid'
  STATIC_ROOT = '/code/staticfiles'

[[mounts]]
  source = 'language_demo_example_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[statics]]
  guest_path = '/code/staticfiles'
  url_prefix = '/static/'
