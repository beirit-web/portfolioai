# PORTFOLIO SAMPLE ONLY. Automatic deployments are disabled.
services:
  - type: web
    name: language-demo-example
    env: python
    plan: free
    # Portfolio sample only; no active deployment or hosting credentials.
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate --noinput
      python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SECURE_SSL_REDIRECT
        sync: false
      - key: SESSION_COOKIE_SECURE
        sync: false
      - key: CSRF_COOKIE_SECURE
        sync: false
      - key: SECURE_HSTS_SECONDS
        sync: false
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        sync: false
      - key: SECURE_HSTS_PRELOAD
        sync: false
      - key: LOGIN_REQUIRED
        value: "False"
      - key: DB_PATH
        sync: false
      - key: DB_BACKUP_PATH
        sync: false
    autoDeploy: false
    disks:
      - name: data
        mountPath: /opt/render/project/src/data
        sizeGB: 1

  - type: cron
    name: demo-secure-backup-example
    env: python
    plan: free
    schedule: "0 2 1 * *"  # monatlich am 1. um 02:00 UTC
    buildCommand: ""
    startCommand: bash utils/secure_backup.sh
    envVars:
      - key: BACKUP_PASSPHRASE
        sync: false
      - key: DB_PATH
        sync: false
      - key: DB_BACKUP_PATH
        sync: false
      - key: BACKUP_RETENTION_DAYS
        sync: false
    disks:
      - name: data
        mountPath: /opt/render/project/src/data
        sizeGB: 1
