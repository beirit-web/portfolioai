<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>{{ status_code }} - Beirit Web</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #06111f;
        --panel: rgba(15, 23, 42, 0.78);
        --text: #f8fafc;
        --muted: #cbd5e1;
        --line: rgba(247, 242, 234, 0.16);
        --accent: #2dd4bf;
        --accent-strong: #99f6e4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 18% 14%, rgba(45, 212, 191, 0.2), transparent 24rem),
          radial-gradient(circle at 88% 12%, rgba(56, 189, 248, 0.14), transparent 26rem),
          linear-gradient(135deg, var(--bg), #0f172a 56%, #082f2d);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      main {
        position: relative;
        width: min(100%, 860px);
        overflow: hidden;
        padding: clamp(28px, 6vw, 64px);
        border: 1px solid var(--line);
        border-radius: 24px;
        background:
          linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.74)),
          radial-gradient(circle at 86% 14%, rgba(45, 212, 191, 0.16), transparent 18rem);
        box-shadow: 0 32px 100px rgba(0, 0, 0, 0.38);
        backdrop-filter: blur(18px);
      }

      main::after {
        content: "";
        position: absolute;
        right: clamp(18px, 5vw, 54px);
        top: clamp(18px, 5vw, 48px);
        width: clamp(92px, 18vw, 160px);
        aspect-ratio: 1;
        border: 1px solid rgba(45, 212, 191, 0.24);
        border-radius: 28px;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
          linear-gradient(180deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
          radial-gradient(circle at 32% 28%, rgba(45, 212, 191, 0.34), transparent 26%),
          rgba(255, 255, 255, 0.04);
        background-size: 24px 24px, 24px 24px, auto, auto;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 20px 70px rgba(0, 0, 0, 0.28);
        transform: rotate(6deg);
        opacity: 0.72;
      }

      .kicker,
      .status {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .status {
        display: inline-flex;
        min-height: 36px;
        align-items: center;
        border: 1px solid rgba(52, 211, 153, 0.32);
        border-radius: 999px;
        padding: 0 14px;
        background: rgba(52, 211, 153, 0.08);
      }

      h1 {
        margin: 10px 0 14px;
        max-width: 12ch;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 1;
        letter-spacing: -0.035em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: clamp(1rem, 2.4vw, 1.14rem);
      }

      .note {
        margin-top: 18px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 30px;
      }

      a {
        min-height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0 18px;
        color: var(--text);
        font-weight: 800;
        text-decoration: none;
      }

      .primary {
        background: var(--accent);
        color: #062013;
        box-shadow: 0 16px 40px rgba(45, 212, 191, 0.24);
      }

      .secondary {
        border: 1px solid var(--line);
      }

      a:hover {
        transform: translateY(-2px);
      }

      a:focus-visible {
        outline: 3px solid rgba(52, 211, 153, 0.6);
        outline-offset: 3px;
      }

      @media (max-width: 520px) {
        body {
          padding: 14px;
          place-items: stretch;
          align-items: center;
        }

        main,
        a {
          width: 100%;
        }

        main::after {
          opacity: 0.28;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Beirit Web</p>
      <p class="status">{{ status_code }}</p>
      <h1>{{ error_title }}</h1>
      <p>{{ error_message }}</p>
      <p class="note">
        Es wurden keine technischen Details ausgegeben. Wenn das Problem bestehen bleibt,
        können Sie eine kurze Nachricht senden.
      </p>
      <div class="actions">
        <a class="primary" href="/">Zur Startseite</a>
        <a class="secondary" href="/kontakt/">Kontakt</a>
      </div>
    </main>
  </body>
</html>
