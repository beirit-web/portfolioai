{% if messages %}
  <div class="auth-messages" aria-live="polite">
    {% for message in messages %}
      <p class="{% if message.level_tag == 'error' %}form-error{% else %}template-inline-note{% endif %}" role="{% if message.level_tag == 'error' %}alert{% else %}status{% endif %}">{{ message }}</p>
    {% endfor %}
  </div>
{% endif %}
