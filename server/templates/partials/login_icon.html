<svg class="login-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  {% if name == "mail" %}
    <rect x="2" y="4" width="20" height="16" rx="5" fill="#dbeafe" />
    <path d="m5 8 7 5 7-5M5 17l4-4m10 4-4-4" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  {% elif name == "lock" %}
    <rect x="4" y="10" width="16" height="12" rx="4" fill="#ccfbf1" />
    <path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v3" stroke="#0f766e" stroke-width="2" stroke-linecap="round" />
  {% elif name == "eye" %}
    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" />
    <circle cx="12" cy="12" r="2.6" fill="#2563eb" />
    <path class="login-eye-slash" d="m4 3 16 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
  {% elif name == "shield" %}
    <path d="m12 2 9 4v6c0 5-5 8-9 10-4-2-9-5-9-10V6l9-4Z" fill="#ccfbf1" />
    <path d="m8 12 3 3 5-6" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  {% elif name == "user" %}
    <circle cx="9" cy="7" r="4" fill="#ddd6fe" />
    <path d="M2 21v-3a7 7 0 0 1 14 0v3" fill="#ede9fe" />
    <path d="M17 9h6m-3-3v6M3 21v-3a6 6 0 0 1 12 0v3" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" />
  {% elif name == "image" %}
    <rect x="2" y="3" width="20" height="18" rx="5" fill="#ede9fe" />
    <circle cx="8" cy="9" r="2.5" fill="#a78bfa" />
    <path d="m4 18 5-5 4 4 3-7 5 8" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  {% elif name == "key" %}
    <circle cx="8" cy="9" r="6" fill="#fef3c7" />
    <path d="m12 13 9 9m-4-4 3-3m-6 0 3-3" stroke="#a16207" stroke-width="2" stroke-linecap="round" />
    <circle cx="7" cy="8" r="2" fill="#a16207" />
  {% elif name == "arrow" %}
    <path d="M4 12h15m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  {% elif name == "back" %}
    <path d="M20 12H5m6-6-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  {% else %}
    <circle cx="12" cy="12" r="10" fill="#dbeafe" />
    <path d="M12 11v6m0-10v.1" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
  {% endif %}
</svg>
