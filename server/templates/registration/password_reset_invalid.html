{% extends "registration/account_base.html" %}
{% block title %}Link ungültig{% endblock %}
{% block account_title %}Link ungültig{% endblock %}
{% block account_content %}
  <p role="alert" data-i18n="password_reset_invalid.subtitle">Der Reset-Link ist abgelaufen oder ungültig. Fordern Sie einfach einen neuen an.</p>
  <div class="template-actions">
    <a class="btn-primary" href="{% url 'password_reset' %}" data-i18n="password_reset_invalid.retry">Neuen Link anfordern</a>
    <a class="btn-ghost" href="{% url 'pages:login' %}">Login</a>
  </div>
{% endblock %}
