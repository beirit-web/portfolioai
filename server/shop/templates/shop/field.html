<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.name == 'delivery_address' or field.name == 'postal_code' or field.name == 'city' %}<small>bei Lieferung</small>{% elif not field.field.required %}<small>optional</small>{% endif %}</label>{{ field }}{% if field.errors %}<ul class="errorlist" id="{{ field.id_for_label }}-errors">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
