# PORTFOLIO SAMPLE ONLY. No hosting account or active deployment target.
# fly.toml sample configuration file for the portfolio demo
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'portfolio-demo-example'
primary_region = 'fra'
console_command = '/code/manage.py shell'

[build]

[env]
  PORTFOLIO_DEMO_MODE = 'True'
  EMAIL_BACKEND = 'django.core.mail.backends.console.EmailBackend'
  CSRF_COOKIE_SECURE = 'True'
  CSRF_TRUSTED_ORIGINS = 'https://portfolio.example.invalid'
  DJANGO_ALLOWED_HOSTS = 'portfolio.example.invalid'
  DB_BACKUP_PATH = '/data/db_backups'
  DB_PATH = '/data/db.sqlite3'
  DEFAULT_FROM_EMAIL = 'contact@portfolio.example.invalid'
  CONTACT_EMAIL = 'contact@portfolio.example.invalid'
  MEDIA_ROOT = '/data/media'
  RESET_LINK_DOMAIN = 'portfolio.example.invalid'
  RESET_LINK_USE_HTTPS = 'True'
  PORT = '8000'
  REDIRECT_OLD_HOSTS = ''
  RUN_MIGRATIONS = '1'
  SECURE_SSL_REDIRECT = 'True'
  SESSION_COOKIE_SECURE = 'True'
  SITE_ACTIVITY = 'Web- und Softwareentwicklung; Übersetzung von Web- und Softwaretexten'
  SITE_ADDRESS = 'Musterstraße 1'
  SITE_BUSINESS_NAME = 'Portfolio Demo'
  SITE_BUSINESS_START_DATE = '01.01.2026'
  SITE_CITY = 'Musterstadt'
  SITE_COUNTRY = 'Deutschland'
  SITE_EMAIL = 'contact@portfolio.example.invalid'
  SITE_LEGAL_FORM = 'Einzelunternehmen (Kleingewerbe)'
  SITE_OWNER_NAME = 'Max Mustermann'
  SITE_POSTAL_CODE = '12345'
  SITE_REGISTER_AUTHORITY = 'Stadt Musterstadt'
  SITE_REGISTER_DATE = '01.01.2026'
  SITE_RESPONSIBLE_PERSON = 'Max Mustermann'
  SITE_TAX_NOTICE = 'Kleinunternehmer im Sinne des § 19 UStG. Es wird keine Umsatzsteuer ausgewiesen.'
  SITE_URL = 'https://portfolio.example.invalid'
  STATIC_ROOT = '/code/staticfiles'
  USER_UPLOADS_ENABLED = 'False'

[[mounts]]
  source = 'portfolio_demo_example_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[statics]]
  guest_path = '/code/staticfiles'
  url_prefix = '/static/'
